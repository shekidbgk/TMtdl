    <script>
      // Prevent Service Worker navigation interception inside AI Studio Preview iframe
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            var isInIframe = window.self !== window.top;
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (var i = 0; i < registrations.length; i++) {
                var reg = registrations[i];
                var scriptURL = (reg.active && reg.active.scriptURL) || (reg.installing && reg.installing.scriptURL) || '';
                if (isInIframe || scriptURL.indexOf('dev-sw.js') !== -1) {
                  reg.unregister();
                }
              }
            }).catch(function () {});
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                for (var j = 0; j < keys.length; j++) {
                  if (keys[j].indexOf('workbox') !== -1) {
                    caches.delete(keys[j]);
                  }
                }
              }).catch(function () {});
            }
            if (!isInIframe) {
              window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function () {});
              });
            }
          }
        } catch (e) {}
      })();
    </script>
